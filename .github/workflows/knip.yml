name: Knip

on:
  workflow_call:
    inputs:
      runs-on:
        description: Single runner label. Use ubuntu-latest unless the repo needs a specific pool.
        type: string
        default: ubuntu-latest
      path:
        description: Directory holding the package.json or workspace root.
        type: string
        default: .
      strict:
        description: Fail on knip findings. Default is report only.
        type: boolean
        default: false
      install-command:
        description: Dependency install command. Use "none" to skip install.
        type: string
        default: pnpm install --frozen-lockfile
      knip-version:
        description: Pinned knip version.
        type: string
        default: 6.44.1
      pnpm-version:
        description: 'pnpm version. "packageManager" reads it from package.json; pass an explicit version when the repo uses bun or has no packageManager field.'
        type: string
        default: packageManager

permissions:
  contents: read

jobs:
  knip:
    name: Knip
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        if: ${{ inputs.pnpm-version == 'packageManager' }}

      - uses: pnpm/action-setup@v4
        if: ${{ inputs.pnpm-version != 'packageManager' }}
        with:
          version: ${{ inputs.pnpm-version }}

      - name: Set up Bun
        if: ${{ startsWith(inputs.install-command, 'bun ') }}
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        if: ${{ inputs.install-command != 'none' }}
        working-directory: ${{ inputs.path }}
        run: ${{ inputs.install-command }}

      - name: Run knip
        shell: bash
        env:
          STRICT: ${{ inputs.strict }}
        run: |
          set +e
          pnpm dlx knip@${{ inputs.knip-version }} --no-progress --reporter json > "$RUNNER_TEMP/knip.json" 2> "$RUNNER_TEMP/knip.err"
          code=$?
          set -e
          cat "$RUNNER_TEMP/knip.err"

          if [ ! -s "$RUNNER_TEMP/knip.json" ] || ! jq empty "$RUNNER_TEMP/knip.json" 2>/dev/null; then
            echo "::error::knip failed to run (exit $code). It produced no valid report, so this is a config or parsing error, not a finding."
            exit 1
          fi

          SUMMARY=$(jq -r 'def total($k): ([.issues[] | .[$k] // [] | length] | add // 0); "Unused files: \(total("files"))\nUnused exports: \(total("exports"))\nUnused exported types: \(total("types"))\nUnused dependencies: \(total("dependencies"))\nUnused devDependencies: \(total("devDependencies"))\nUnlisted dependencies: \(total("unlisted"))\nDuplicate exports: \(total("duplicates"))\nUnresolved imports: \(total("unresolved"))"' "$RUNNER_TEMP/knip.json")
          printf '%s\n' "$SUMMARY"
          {
            echo "### Knip"
            echo ""
            echo '```'
            echo "$SUMMARY"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$code" -ge 2 ]; then
            echo "::error::knip exited $code. Treating it as a tool error, not a finding."
            exit "$code"
          fi

          if [ "$STRICT" = "true" ] && [ "$code" -ne 0 ]; then
            echo "::error::knip found unused files, exports, or dependencies."
            exit "$code"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knip
          path: |
            ${{ runner.temp }}/knip.json
            ${{ runner.temp }}/knip.err
          if-no-files-found: warn
