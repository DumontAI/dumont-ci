name: Secret Scan

on:
  workflow_call:
    inputs:
      runs-on:
        description: Single runner label. Use ubuntu-latest unless the repo needs a specific pool.
        type: string
        default: ubuntu-latest
      gitleaks-version:
        description: Pinned gitleaks release version, without the leading v.
        type: string
        default: 8.30.1

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${{ inputs.gitleaks-version }}/gitleaks_${{ inputs.gitleaks-version }}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set +e
          if [ -n "${BASE_REF:-}" ]; then
            git fetch --no-tags origin "$BASE_REF"
            gitleaks git . --log-opts="origin/${BASE_REF}..HEAD" \
              --redact --no-banner --exit-code 1 \
              --report-format json --report-path "$RUNNER_TEMP/gitleaks.json" > "$RUNNER_TEMP/gitleaks.log" 2>&1
          else
            gitleaks git . \
              --redact --no-banner --exit-code 1 \
              --report-format json --report-path "$RUNNER_TEMP/gitleaks.json" > "$RUNNER_TEMP/gitleaks.log" 2>&1
          fi
          code=$?
          set -e
          cat "$RUNNER_TEMP/gitleaks.log"

          if [ "$code" -eq 1 ]; then
            echo "::error::gitleaks found leaked credentials. Remove them and rotate the affected keys."
            exit 1
          fi
          if [ "$code" -gt 1 ]; then
            echo "::error::gitleaks failed with exit $code"
            exit "$code"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks
          path: ${{ runner.temp }}/gitleaks.json
          if-no-files-found: warn
